<!DOCTYPE html>
<html>
<head>
<title>Rose Glow Beauty - 8 Products Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#fff0f3}
.top{background:#b76e79;color:white;text-align:center;padding:8px;font-size:13px}
header{background:white;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 10px #0001}
.logo{font-weight:900;font-size:22px;color:#b76e79}
.hero{padding:50px 5%;background:linear-gradient(to right,#ffe4e8,#fff0f3);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between}
.hero h1{font-size:42px;color:#4a2022}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;padding:30px 5%}
.card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 5px 20px #0001;text-align:center;padding-bottom:15px}
.card img{width:100%;height:240px;object-fit:cover}
.card h3{margin:10px;font-size:16px}
.price{color:#b76e79;font-weight:bold;font-size:18px}
.btn{background:#b76e79;color:white;border:0;padding:10px 20px;border-radius:25px;cursor:pointer;margin-top:8px;font-weight:bold}
.btn:hover{background:#9d5d68}
#cart{position:fixed;right:20px;top:15px;background:#4a2022;color:white;padding:8px 15px;border-radius:20px;cursor:pointer;z-index:999}
</style>
</head>
<body>

<div class="top">✨ Free Shipping Over ₹500
